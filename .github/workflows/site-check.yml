name: Live site check (temporary diagnostic)
on:
  push:
    branches: [claude/wizardly-ramanujan-m6615w]
    paths: [.github/workflows/site-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          sudo apt-get install -y -qq dnsutils whois >/dev/null 2>&1 || true
          for t in A AAAA CNAME NS; do echo "== taliabout.com $t"; dig +short taliabout.com $t; done
          echo "== www.taliabout.com"; dig +short www.taliabout.com
          echo "== NS via public resolver"; dig +short @1.1.1.1 taliabout.com NS
          echo "== whois"; whois taliabout.com | grep -iE "expir|status|registrar:|name server" | head -12 || true
      - name: HTTP
        run: |
          for u in http://taliabout.com/ https://taliabout.com/ https://www.taliabout.com/ https://taliabout.github.io/Talia-Bout-Personal-Portfolio-/ https://taliabout.github.io/; do
            echo "== $u"; curl -sS -o /dev/null -L --max-time 20 -w "final=%{url_effective} status=%{http_code} ssl_verify=%{ssl_verify_result}\n" "$u" || echo "CURL FAILED"
          done
          echo "== headers"; curl -sSI --max-time 20 https://taliabout.com/ || true
      - name: Content and assets
        run: |
          curl -sS --max-time 20 https://taliabout.com/ -o home.html || true
          echo "bytes: $(wc -c < home.html)"; grep -o "<title>[^<]*" home.html || true
          grep -c "feature-card" home.html || echo "latest homepage markup NOT found"
          for a in css/style.css js/script.js assets/fonts/inter-var.woff2 assets/fonts/playfair-display-var.woff2 assets/img/talia-portrait-800.webp assets/Talia-Bout-Resume.pdf vertex-medicaid-case-study.html experience.html projects.html; do
            printf "%-45s %s\n" "$a" "$(curl -sS -o /dev/null --max-time 20 -w '%{http_code} %{content_type}' https://taliabout.com/$a)"
          done
      - name: TLS certificate
        run: |
          echo | openssl s_client -servername taliabout.com -connect taliabout.com:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || echo "no certificate"
