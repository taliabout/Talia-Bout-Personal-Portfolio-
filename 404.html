<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Talia R. Bout</title>
<meta name="robots" content="noindex" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #f7f5ee; --text: #14201b; --muted: #4b5751; --link: #1f6f5c; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1210; --text: #ede8e0; --muted: #adb6ad; --link: #57b79a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 520px; }
  .code { font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--link); margin: 0 0 14px; }
  h1 { font-family: "Source Serif 4", Georgia, serif; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1; margin: 0 0 16px; }
  p { color: var(--muted); line-height: 1.65; margin: 0 0 28px; }
  a.btn { display: inline-block; padding: 11px 22px; border-radius: 4px; background: var(--text); color: var(--bg); text-decoration: none; font-family: "IBM Plex Mono", monospace; font-size: 0.86rem; }
  a.btn:hover { opacity: 0.88; }
</style>
</head>
<body>
<main>
  <p class="code">404 &middot; Page not found</p>
  <h1>This page doesn't exist.</h1>
  <p>The link may be mistyped or out of date. Everything on this site is reachable from the homepage.</p>
  <a class="btn" id="home-link" href="./">Back to homepage</a>
</main>
<script>
  (function () {
    var repo = "/Talia-Bout-Personal-Portfolio-/";
    var home = location.pathname.indexOf(repo) === 0 ? repo : "/";
    document.getElementById("home-link").setAttribute("href", home);
  })();
</script>
</body>
</html>
